name: Scrape Water Quality Data

# 触发方式:
#   workflow_dispatch   - GitHub Actions 页面手动执行
#   repository_dispatch - 外部定时服务 (cron-job.org) 调用, event_type: cron_trigger
#
# 观察模式说明 (2026-09-04):
#   数据源网站 szzdjc.cnemc.cn:8070 自 2026-09-04 起对 GitHub runner 的海外 IP
#   返回 -1 拦截响应 (HTTP 200 + 裸整数 JSON), 本 workflow 目前抓不到数据。
#   现保留外部定时触发, 用于持续观察该站点后期是否解除对 GitHub IP 的封禁。
#   失败属预期结果, 日志会明确打印 "-1 = 出口 IP 被拦截" 及响应样本。
#
#   正式的定时抓取已迁移到国内出口:
#     - Gitee Go 流水线 (gekko-cai/National_Water_Data, cron 每 2 小时)
#     - 本机计划任务 local_scrape/scrape_local.py (每 2 小时)
on:
  workflow_dispatch:
  repository_dispatch:
    types: [cron_trigger]

# 防止重复抓取, 对数据源站点更友好
concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 被拦截时每页会等待 60s 重试 (最多 2 次/页), 9 页最坏约 18 分钟,
    # 加上依赖安装, 25 分钟留足余量
    timeout-minutes: 25
    permissions:
      contents: write # 需要写权限来推送数据文件
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python -u scraper/scraper.py
        env:
          TZ: Asia/Shanghai # 设置时区为北京时间
          PYTHONUNBUFFERED: '1' # 实时输出日志, job 被终止时不丢失

      # 注意: 本机计划任务 (local_scrape/scrape_local.py) 也在向本仓库推送数据,
      # 两边可能同时写。必须先 pull --rebase 再提交, 否则 push 会被远端拒绝。
      # pull 必须放在写入数据之前(此时工作区干净), 否则 rebase 会因有未提交改动而失败。
      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || echo "[WARN] 同步远端失败, 继续尝试提交"
          git add Data/
          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            COMMIT_MSG="Auto-scrape: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M') Beijing time"
            git commit -m "$COMMIT_MSG"
            # 首次推送若被拒(远端又有新提交), 再同步一次后重试
            git push || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push; }
          fi
