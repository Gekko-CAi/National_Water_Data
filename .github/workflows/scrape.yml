name: Scrape Water Quality Data

# 触发方式:
#   1. schedule            - GitHub 内置定时 (UTC 每 2 小时第 25 分)
#   2. repository_dispatch - 外部定时服务 (cron-job.org) 调用, event_type: scrape
#   3. workflow_dispatch    - GitHub Actions 页面手动执行
#
# 北京时间触发点: 00:25, 02:25, 04:25 ... 22:25 (两条链路同一时间点, 互为备份)
#
# 历史说明 (2026-09-06 修复):
#   event_type 曾于 09-04 被改为 cron_trigger, 与 cron-job.org 实际发送的 "scrape"
#   不匹配, 导致 workflow 假性停摆 —— GitHub 的 dispatch API 对无人监听的 event_type
#   同样返回 204, cron-job.org 因此一直显示成功, 但 GitHub 侧再无任何 run。
#   现已改回 scrape, 并恢复内置 schedule。
on:
  schedule:
    - cron: '25 */2 * * *'

  repository_dispatch:
    types: [scrape]

  workflow_dispatch:

# 同一时间点的两个触发只保留一个, 避免并发写文件与 git 冲突
concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    # 被拦截时每页会等待重试, 9 页最坏约 18 分钟, 加上依赖安装留足余量
    timeout-minutes: 25
    permissions:
      contents: write # 需要写权限来推送数据文件
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python -u scraper/scraper.py
        env:
          TZ: Asia/Shanghai # 设置时区为北京时间
          PYTHONUNBUFFERED: '1' # 实时输出日志, job 被终止时不丢失

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin "${GITHUB_REF_NAME}" || echo "[WARN] 同步远端失败, 继续尝试提交"
          git add Data/
          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            COMMIT_MSG="Auto-scrape: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M') Beijing time"
            git commit -m "$COMMIT_MSG"
            git push || { git pull --rebase origin "${GITHUB_REF_NAME}" && git push; }
          fi
