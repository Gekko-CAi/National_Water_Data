name: Scrape Water Quality Data

# 手动触发用 (workflow_dispatch)。
# 说明: 数据源网站 szzdjc.cnemc.cn:8070 自 2026-09-04 起对 GitHub runner 的
# 海外 IP 返回 -1 拦截响应, 本 workflow 已无法抓到数据。
# 定时抓取已迁移到国内出口: 本机计划任务运行 local_scrape/scrape_local.py,
# 经 Git Data API 直接推送数据到本仓库。如需恢复 Actions 抓取,
# 重新加回 schedule 触发即可 (scraper.py v2 会对拦截响应给出清晰诊断)。
on:
  workflow_dispatch:

# 防止重复抓取, 对数据源站点更友好
concurrency:
  group: scrape
  cancel-in-progress: true

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # 需要写权限来推送数据文件
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r scraper/requirements.txt

      - name: Run scraper
        run: python -u scraper/scraper.py
        env:
          TZ: Asia/Shanghai # 设置时区为北京时间
          PYTHONUNBUFFERED: '1' # 实时输出日志, job 被终止时不丢失

      - name: Commit and push data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Data/
          if git diff --staged --quiet; then
            echo "No new data to commit"
          else
            COMMIT_MSG="Auto-scrape: $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M') Beijing time"
            git commit -m "$COMMIT_MSG"
            git push
          fi
